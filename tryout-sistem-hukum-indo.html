<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tryout Ilmu Hukum</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap');

  :root {
    --navy: #1a2744;
    --navy-light: #243158;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --bg: #f5f2ec;
    --white: #ffffff;
    --green: #2e7d52;
    --red: #b5302a;
    --text: #2c2c2c;
    --muted: #6b6b6b;
    --border: #ddd8cc;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--navy);
    color: white;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .header-title h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    letter-spacing: -0.02em;
    color: white;
  }
  .header-title p {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.55);
    font-style: italic;
    margin-top: 2px;
    letter-spacing: 0.03em;
  }
  .scoreboard {
    display: flex;
    gap: 10px;
  }
  .score-box {
    text-align: center;
    min-width: 72px;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .score-box .val {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    display: block;
    line-height: 1;
  }
  .score-box .lbl {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.6;
    display: block;
    margin-top: 3px;
  }
  .score-box.answered .val { color: var(--gold-light); }
  .score-box.correct .val  { color: #6ee7a0; }
  .score-box.wrong .val    { color: #f87171; }

  /* PROGRESS BAR */
  .progress-bar-wrap {
    background: rgba(255,255,255,0.1);
    height: 3px;
  }
  .progress-bar {
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    width: 0%;
    transition: width 0.4s ease;
  }

  /* FILTER */
  .filter-bar {
    background: var(--navy-light);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .filter-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label { font-size: 0.75rem; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; margin-right: 4px; }
  .filter-btn {
    font-family: 'Source Serif 4', serif;
    font-size: 0.75rem;
    padding: 4px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--navy);
    font-weight: 600;
  }
  .reset-btn {
    margin-left: auto;
    font-family: 'Source Serif 4', serif;
    font-size: 0.72rem;
    padding: 4px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,100,100,0.4);
    background: transparent;
    color: rgba(255,150,150,0.8);
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover { background: rgba(255,80,80,0.15); border-color: rgba(255,100,100,0.7); color: #f87171; }

  /* MAIN */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* QUESTION CARD */
  .question-card {
    background: var(--white);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: box-shadow 0.2s;
  }
  .question-card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.12); }
  .question-card.answered-correct { border-color: #a7f3c0; }
  .question-card.answered-wrong   { border-color: #fca5a5; }

  .question-head {
    padding: 18px 22px 14px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .q-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--navy);
    min-width: 30px;
    line-height: 1.5;
  }
  .q-text {
    font-size: 0.925rem;
    line-height: 1.65;
    color: var(--text);
    flex: 1;
  }
  .q-badge {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid var(--gold);
    color: var(--gold);
    white-space: nowrap;
    font-weight: 600;
    margin-top: 2px;
  }

  /* OPTIONS */
  .options {
    padding: 0 22px 18px 66px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: transparent;
    cursor: pointer;
    text-align: left;
    font-family: 'Source Serif 4', serif;
    font-size: 0.875rem;
    color: var(--text);
    line-height: 1.5;
    transition: all 0.18s;
    width: 100%;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--navy);
    background: #f0f0f8;
  }
  .option-btn:disabled { cursor: default; }
  .option-letter {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--navy);
    min-width: 22px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--navy);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s;
    flex-shrink: 0;
  }

  /* RESULT STATES */
  .option-btn.correct-answer {
    background: #f0faf5;
    border-color: var(--green);
    color: var(--green);
    font-weight: 600;
  }
  .option-btn.correct-answer .option-letter {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .option-btn.wrong-answer {
    background: #fff5f5;
    border-color: var(--red);
    color: var(--red);
  }
  .option-btn.wrong-answer .option-letter {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  .option-btn.revealed-correct {
    background: #f0faf5;
    border-color: var(--green);
    color: var(--green);
    opacity: 0.75;
  }
  .option-btn.revealed-correct .option-letter {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }

  /* HIDDEN */
  .question-card.hidden { display: none; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-style: italic;
  }

  /* FOOTER COUNT */
  .footer-info {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    padding: 12px;
    font-style: italic;
  }

  @media(max-width: 600px) {
    .header-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
    .scoreboard { width: 100%; justify-content: space-between; }
    .options { padding-left: 22px; }
    .q-badge { display: none; }
  }
</style>
</head>

      </div>
    </div>
  </div>

    <div class="progress-bar" id="progress-bar"></div>
  </div>
</header>

    <button class="filter-btn" data-filter="unanswered">Belum Dijawab</button>
    <button class="filter-btn" data-filter="correct">Benar</button>
    <button class="filter-btn" data-filter="wrong">Salah</button>
    <button class="reset-btn" id="reset-btn">↺ Reset</button>
  </div>
</div>

<main>
  <div id="questions-container"></div>
  <div class="footer-info" id="footer-info"></div>
</main>

// State
const state = {};
questions.forEach(q => state[q.id] = null); // null = unanswered, true = correct, false = wrong

let filter = 'all';

function getLetters(){ return ['A','B','C','D','E','F']; }

function renderAll() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  const letters = getLetters();
  let shown = 0;

  questions.forEach(q => {
    const answered = state[q.id] !== null;
    const correct = state[q.id] === true;
    const wrong = state[q.id] === false;

    // Filter logic
    if (filter === 'unanswered' && answered) return;
    if (filter === 'correct' && !correct) return;
    if (filter === 'wrong' && !wrong) return;

    shown++;
    const card = document.createElement('div');
    card.className = 'question-card' + (correct ? ' answered-correct' : wrong ? ' answered-wrong' : '');
    card.id = 'q-' + q.id;

    let optionsHTML = '';
    q.options.forEach((opt, i) => {
      let cls = 'option-btn';
      if (answered) {
        if (i === q.answer) cls += ' revealed-correct';
        if (i === state[q.id + '_chosen'] && i !== q.answer) cls += ' wrong-answer';
        if (i === state[q.id + '_chosen'] && i === q.answer) cls = 'option-btn correct-answer';
      }
      optionsHTML += `<button class="${cls}" data-qid="${q.id}" data-idx="${i}" ${answered ? 'disabled' : ''}>
        <span class="option-letter">${letters[i]}</span>
        ${opt}
      </button>`;
    });

    card.innerHTML = `
      <div class="question-head">
        <span class="q-num">${q.id}.</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="options">${optionsHTML}</div>
    `;
    container.appendChild(card);
  });

  if (shown === 0) {
    container.innerHTML = '<div class="empty-state">Tidak ada soal yang sesuai filter ini.</div>';
  }
  document.getElementById('footer-info').textContent = shown + ' dari ' + questions.length + ' soal ditampilkan';
}

function updateScore() {
  const answered = Object.values(state).filter(v => v !== null).length;
  const correct = Object.values(state).filter(v => v === true).length;
  const wrong = Object.values(state).filter(v => v === false).length;
  document.getElementById('cnt-answered').textContent = answered;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-wrong').textContent = wrong;
  document.getElementById('progress-bar').style.width = (answered / questions.length * 100) + '%';
}

// Event delegation for option clicks
document.getElementById('questions-container').addEventListener('click', e => {
  const btn = e.target.closest('.option-btn');
  if (!btn || btn.disabled) return;
  const qid = parseInt(btn.dataset.qid);
  const idx = parseInt(btn.dataset.idx);
  const q = questions.find(x => x.id === qid);
  const correct = idx === q.answer;
  state[qid] = correct;
  state[qid + '_chosen'] = idx;
  updateScore();
  renderAll();
  // Scroll to the card
  setTimeout(() => {
    const card = document.getElementById('q-' + qid);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
});

// Filter buttons
 
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    renderAll();
  });
});

// Reset
document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('Reset semua jawaban?')) return;
  questions.forEach(q => { state[q.id] = null; delete state[q.id + '_chosen']; });
  updateScore();
  renderAll();
});

// Init
renderAll();
updateScore();
</script>
</body>
</html>
