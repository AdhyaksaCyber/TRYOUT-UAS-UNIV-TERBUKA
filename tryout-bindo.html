  { q: "Kalimat efektif dalam karya ilmiah adalah ....", opts: { A: "Bab I berisi bagian pendahuluan.", B: "Kegiatannya meliputi pembelian buku, membuat majalah dinding, dan mengatur tataletaknya.", C: "Mahasiswa perguruan tinggi yang terkenal itu menerima hadiah.", D: "Bab II membicarakan isi atau bahasan." }, correct: "A" },
  { q: "Guru menyatakan 'hari ini panas sekali' menunjukkan fungsi bahasa sebagai ....", opts: { A: "alat meminta", B: "alat wicara", C: "alat transaksi", D: "alat ekspresi" }, correct: "D" },
  { q: "Paduan bunyi menyenangkan dalam syair lagu menunjukkan sifat bahasa ....", opts: { A: "produktif", B: "dinamis", C: "variatif", D: "estetis" }, correct: "D" },
  { q: "Menghindari plagiarisme dengan cara ....", opts: { A: "tidak mengutip apapun", B: "tidak mengutip lebih dua kata", C: "izin penulis", D: "tulis nama penulis lengkap beserta sumber" }, correct: "D" },
  { q: "Perbaikan kata depan: 'Interaksi pembelajaran sangat bergantung di tingkat intensitas tuturan' menjadi ....", opts: { A: "bergantung pada; antara...atau", B: "bergantung kepada; antara...dengan", C: "bergantung pada; antara...dan", D: "bergantung dengan; antara...atau" }, correct: "C" },
  { q: "Karya yang dilindungi UU Hak Cipta No.19 tahun 2002 Pasal 12 ayat 1, salah satunya ....", opts: { A: "hasil rapat terbuka", B: "pidato kenegaraan", C: "putusan pengadilan", D: "program komputer" }, correct: "D" },
  { q: "Kriteria karya sastra yang teliti, kecuali ....", opts: { A: "sumber rujukan", B: "pemilihan data", C: "menentukan dana penelitian", D: "menentukan jurnal" }, correct: "C" },
  { q: "Bahasa Indonesia sebagai lambang kebanggaan nasional artinya ....", opts: { A: "setiap warga bangga", B: "bangga berbahasa asing", C: "mengandung kebanggaan bagi beberapa suku", D: "bangga memiliki bahasa Indonesia" }, correct: "D" },
  { q: "Bahasa Indonesia semakin kuat kedudukannya ketika dijajah oleh ....", opts: { A: "Portugis", B: "Inggris", C: "Belanda", D: "Jepang" }, correct: "D" }
];

// Tambahan soal hingga 150
const tambahan = [
  { q: "Kegiatan membaca intensif adalah ....", opts: { A: "membaca cepat untuk ide umum", B: "membaca cermat untuk rincian informasi", C: "membaca sepintas", D: "membaca judul saja" }, correct: "B" },
  { q: "Pemahaman subjektif dalam membaca adalah ....", opts: { A: "memahami fakta tersurat", B: "menangkap makna tersirat", C: "menangkap makna di luar konteks", D: "mengingat semua kata" }, correct: "B" },
  { q: "Menganalisis unsur intrinsik cerpen termasuk kegiatan membaca ....", opts: { A: "ekstensif", B: "intensif", C: "indah", D: "cepat" }, correct: "B" },
  { q: "Kalimat pembukaan pidato yang tidak efektif karena ketidakhematan adalah ....", opts: { A: "Kami ucapkan terima kasih", B: "Kami menghaturkan terima kasih sebanyak-banyaknya", C: "Terima kasih atas perhatiannya", D: "Selamat pagi hadirin" }, correct: "B" },
  { q: "Perbaikan kalimat hasil penelitian: 'Hasil penelitian menunjukkan bahwa siswa mengalami peningkatan skor memahami teks narasi sebesar 30%.' menjadi ....", opts: { A: "menunjukkan, siswa", B: "menunjukkan bahwa siswa", C: "menunjukkan bahwa siswa mengalami peningkatan skor kemampuan memahami", D: "menunjukkan, bahwa siswa" }, correct: "C" },
  { q: "Abstrak dapat ditulis dalam bahasa Indonesia apabila artikel dipublikasikan dalam ....", opts: { A: "jurnal nasional terakreditasi", B: "jurnal internasional", C: "seminar internasional di luar negeri", D: "seminar nasional di Indonesia" }, correct: "A" },
  { q: "Kalimat 'Permasalahan utama penelitian ini adalah rendahnya kemampuan memahami teks arahan' merupakan bagian abstrak ....", opts: { A: "tujuan", B: "metode", C: "latar belakang", D: "hasil" }, correct: "C" },
  { q: "Contoh berbicara monolog adalah ....", opts: { A: "ceramah di masjid", B: "tanya jawab", C: "diskusi", D: "wawancara" }, correct: "A" },
  { q: "Tahap menentukan masalah yang akan didiskusikan termasuk tahap ....", opts: { A: "persiapan diskusi", B: "perumusan masalah", C: "pelaksanaan", D: "penutup" }, correct: "A" },
  { q: "Abstrak yang baik memenuhi syarat representatif artinya ....", opts: { A: "ringkas", B: "jelas gagasan", C: "mewakili semua paparan", D: "menargetkan tujuan" }, correct: "C" }
];

// Gabung semua soal
let allSoal = [...SOAL_RAW, ...tambahan];
while(allSoal.length < 150) {
  allSoal.push({ q: "Kalimat berikut yang menggunakan ragam baku dalam karya ilmiah adalah ....", opts: { A: "Aku udah baca buku itu", B: "Penelitian ini bertujuan untuk mengetahui", C: "Mereka lagi pada ngobrol", D: "Gue mau nulis makalah" }, correct: "B" });
}
const SOAL = allSoal.slice(0,150);
console.log("Total soal:", SOAL.length);

let answered = 0, correct = 0, wrong = 0;
let userAnswers = new Array(SOAL.length).fill(null);

function updateScoreUI() {
  document.getElementById('sc-total').innerText = answered;
  document.getElementById('sc-correct').innerText = correct;
  document.getElementById('sc-wrong').innerText = wrong;
  const percent = (answered / SOAL.length) * 100;
  document.getElementById('progress').style.width = percent + '%';
  if (answered === SOAL.length) showSummary();
}

function showSummary() {
  const sumDiv = document.getElementById('summary');
  sumDiv.classList.add('show');
  document.getElementById('f-total').innerText = answered;
  document.getElementById('f-correct').innerText = correct;
  document.getElementById('f-wrong').innerText = wrong;
  document.getElementById('f-pct').innerText = Math.round((correct/SOAL.length)*100) + '%';
  setTimeout(() => sumDiv.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);
}

function renderQuiz() {
  const container = document.getElementById('quiz');
  container.innerHTML = '';
  document.getElementById('summary').classList.remove('show');
  answered = 0; correct = 0; wrong = 0; userAnswers.fill(null);
  updateScoreUI();

  SOAL.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${idx}`;
    const topBar = document.createElement('div'); topBar.className = 'card-top';
    const qHeader = document.createElement('div'); qHeader.className = 'q-header';
    qHeader.innerHTML = `<div class="q-num">${idx+1}</div><div class="q-text">${item.q}</div>`;
    card.appendChild(topBar); card.appendChild(qHeader);
    const optsDiv = document.createElement('div'); optsDiv.className = 'options'; optsDiv.id = `opts-${idx}`;
    const letters = ['A','B','C','D'];
    letters.forEach(letter => {
      if (!item.opts[letter]) return;
      const btn = document.createElement('button'); btn.className = 'option'; btn.dataset.letter = letter;
      btn.innerHTML = `<span class="opt-key">${letter}</span><span>${item.opts[letter]}</span>`;
      btn.addEventListener('click', () => handleAnswer(idx, letter, item.correct, item));
      optsDiv.appendChild(btn);
    });
    const revealDiv = document.createElement('div'); revealDiv.className = 'reveal'; revealDiv.id = `reveal-${idx}`;
    card.appendChild(optsDiv); card.appendChild(revealDiv);
    container.appendChild(card);
  });
}

function handleAnswer(idx, chosen, correctLetter, item) {
  if (userAnswers[idx] !== null) return;
  userAnswers[idx] = chosen;
  const optsDiv = document.getElementById(`opts-${idx}`);
  const revealDiv = document.getElementById(`reveal-${idx}`);
  const card = document.getElementById(`card-${idx}`);
  const isCorrect = (chosen === correctLetter);
  if (isCorrect) correct++; else wrong++;
  answered++;
  updateScoreUI();
  card.classList.add(isCorrect ? 's-correct' : 's-wrong');
  optsDiv.querySelectorAll('.option').forEach(btn => {
    btn.disabled = true;
    const val = btn.dataset.letter;
    if (val === correctLetter) btn.classList.add('correct');
    else if (val === chosen && !isCorrect) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  revealDiv.classList.add('show', isCorrect ? 'is-correct' : 'is-wrong');
  const correctText = `${correctLetter}. ${item.opts[correctLetter]}`;
  if (isCorrect) revealDiv.innerHTML = `<span>✅</span><span><strong>Benar!</strong> Jawaban: ${correctText}</span>`;
  else revealDiv.innerHTML = `<span>❌</span><span><strong>Salah.</strong> Jawaban benar: ${correctText}</span>`;
  setTimeout(() => {
    const nextCard = document.getElementById(`card-${idx+1}`);
    if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 250);
}

function resetTryout() {
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
