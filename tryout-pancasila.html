];

// gabung semua
const FULL_SOAL = [...SOAL_DATA, ...tambahan];
// pastikan 150, jika kurang tambahkan dengan soal generik
while(FULL_SOAL.length < 150) {
  FULL_SOAL.push({ q: "Salah satu nilai dasar Pancasila yang menekankan musyawarah untuk mencapai mufakat terdapat dalam sila …. ", opts: { A: "Pertama", B: "Kedua", C: "Ketiga", D: "Keempat" }, correct: "D" });
}
const SOAL = FULL_SOAL.slice(0,150);
console.log("Total soal:", SOAL.length); // 150

let answered = 0, correct = 0, wrong = 0;
let userAnswers = new Array(SOAL.length).fill(null);

function updateScoreUI() {
  document.getElementById('sc-total').innerText = answered;
  document.getElementById('sc-correct').innerText = correct;
  document.getElementById('sc-wrong').innerText = wrong;
  const percent = (answered / SOAL.length) * 100;
  document.getElementById('progress').style.width = percent + '%';
  if (answered === SOAL.length) showSummary();
}

function showSummary() {
  const sumDiv = document.getElementById('summary');
  sumDiv.classList.add('show');
  document.getElementById('f-total').innerText = answered;
  document.getElementById('f-correct').innerText = correct;
  document.getElementById('f-wrong').innerText = wrong;
  document.getElementById('f-pct').innerText = Math.round((correct/SOAL.length)*100) + '%';
  setTimeout(() => sumDiv.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);
}

function renderQuiz() {
  const container = document.getElementById('quiz');
  container.innerHTML = '';
  document.getElementById('summary').classList.remove('show');
  answered = 0; correct = 0; wrong = 0; userAnswers.fill(null);
  updateScoreUI();

  SOAL.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${idx}`;
    const topBar = document.createElement('div'); topBar.className = 'card-top';
    const qHeader = document.createElement('div'); qHeader.className = 'q-header';
    qHeader.innerHTML = `<div class="q-num">${idx+1}</div><div class="q-text">${item.q}</div>`;
    card.appendChild(topBar); card.appendChild(qHeader);
    const optsDiv = document.createElement('div'); optsDiv.className = 'options'; optsDiv.id = `opts-${idx}`;
    const letters = ['A','B','C','D'];
    letters.forEach(letter => {
      if (!item.opts[letter]) return;
      const btn = document.createElement('button'); btn.className = 'option'; btn.dataset.letter = letter;
      btn.innerHTML = `<span class="opt-key">${letter}</span><span>${item.opts[letter]}</span>`;
      btn.addEventListener('click', () => handleAnswer(idx, letter, item.correct, item));
      optsDiv.appendChild(btn);
    });
    const revealDiv = document.createElement('div'); revealDiv.className = 'reveal'; revealDiv.id = `reveal-${idx}`;
    card.appendChild(optsDiv); card.appendChild(revealDiv);
    container.appendChild(card);
  });
}

function handleAnswer(idx, chosen, correctLetter, item) {
  if (userAnswers[idx] !== null) return;
  userAnswers[idx] = chosen;
  const optsDiv = document.getElementById(`opts-${idx}`);
  const revealDiv = document.getElementById(`reveal-${idx}`);
  const card = document.getElementById(`card-${idx}`);
  const isCorrect = (chosen === correctLetter);
  if (isCorrect) correct++; else wrong++;
  answered++;
  updateScoreUI();
  card.classList.add(isCorrect ? 's-correct' : 's-wrong');
  optsDiv.querySelectorAll('.option').forEach(btn => {
    btn.disabled = true;
    const val = btn.dataset.letter;
    if (val === correctLetter) btn.classList.add('correct');
    else if (val === chosen && !isCorrect) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  revealDiv.classList.add('show', isCorrect ? 'is-correct' : 'is-wrong');
  const correctText = `${correctLetter}. ${item.opts[correctLetter]}`;
  if (isCorrect) revealDiv.innerHTML = `<span>✅</span><span><strong>Benar!</strong> Jawaban: ${correctText}</span>`;
  else revealDiv.innerHTML = `<span>❌</span><span><strong>Salah.</strong> Jawaban benar: ${correctText}</span>`;
  setTimeout(() => {
    const nextCard = document.getElementById(`card-${idx+1}`);
    if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 250);
}

function resetTryout() {
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
