<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tryout Pengantar Ilmu Hukum</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --paper: #fffdf7;
    --ink: #1a1208;
    --ink-light: #5c4a2a;
    --accent: #8b1a1a;
    --accent-light: #c0392b;
    --gold: #c8922a;
    --green: #1a6b3a;
    --correct-bg: #e8f5ec;
    --wrong-bg: #faeaea;
    --option-hover: #f0ebe0;
    --border: #d4c9a8;
    --shadow: rgba(26,18,8,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(200,185,150,0.15) 28px);
  }

  .header {
    background: var(--ink);
    color: var(--bg);
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid var(--gold);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    color: var(--bg);
  }
  
  .header-left p {
    font-size: 0.78rem;
    color: #c8b898;
    font-style: italic;
    margin-top: 2px;
  }

  .scoreboard {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .score-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(200,185,150,0.3);
    border-radius: 6px;
    padding: 6px 14px;
    text-align: center;
    min-width: 70px;
  }

  .score-pill .num {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1;
  }

  .score-pill .lbl {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #c8b898;
    margin-top: 2px;
  }

  .score-pill.total { color: #f0e8d0; }
  .score-pill.correct { color: #6edd99; }
  .score-pill.wrong { color: #ff8080; }

  .progress-bar {
    height: 3px;
    background: rgba(200,185,150,0.2);
    position: sticky;
    top: 88px;
    z-index: 99;
  }
  
  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.4s ease;
    width: 0%;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .question-card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-bottom: 36px;
    box-shadow: 0 2px 12px var(--shadow);
    overflow: hidden;
    transition: opacity 0.3s;
  }

  .question-header {
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .q-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--accent);
    font-weight: 700;
    min-width: 32px;
    padding-top: 1px;
  }

  .q-text {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--ink);
    font-weight: 400;
  }

  .options {
    padding: 16px 28px 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s ease;
    background: transparent;
    text-align: left;
    width: 100%;
    font-family: 'Source Serif 4', serif;
    font-size: 0.9rem;
    color: var(--ink);
    line-height: 1.5;
  }

  .option:hover:not(:disabled) {
    background: var(--option-hover);
    border-color: var(--gold);
    transform: translateX(2px);
  }

  .option .opt-letter {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: var(--ink-light);
    min-width: 18px;
    font-size: 0.9rem;
  }

  .option:disabled { cursor: default; }

  /* After answer states */
  .option.correct {
    background: var(--correct-bg) !important;
    border-color: var(--green) !important;
    color: var(--green);
    transform: none !important;
  }
  
  .option.correct .opt-letter { color: var(--green); }

  .option.wrong {
    background: var(--wrong-bg) !important;
    border-color: var(--accent-light) !important;
    color: var(--accent-light);
  }
  
  .option.wrong .opt-letter { color: var(--accent-light); }

  .option.dimmed {
    opacity: 0.45;
  }

  /* Answer reveal */
  .answer-reveal {
    margin: 0 28px 20px;
    padding: 12px 16px;
    border-radius: 3px;
    font-size: 0.88rem;
    display: none;
    align-items: center;
    gap: 10px;
    border-left: 3px solid;
  }

  .answer-reveal.show { display: flex; }

  .answer-reveal.is-correct {
    background: #e8f5ec;
    border-color: var(--green);
    color: #145a32;
  }

  .answer-reveal.is-wrong {
    background: #faeaea;
    border-color: var(--accent-light);
    color: var(--accent);
  }

  .answer-reveal .icon {
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .answer-reveal .reveal-text {
    font-style: italic;
    line-height: 1.5;
  }

  .answer-reveal strong {
    font-style: normal;
    font-weight: 600;
  }

  /* Status badge on card */
  .card-status {
    height: 4px;
    width: 100%;
  }
  .card-status.s-correct { background: var(--green); }
  .card-status.s-wrong { background: var(--accent-light); }

  /* Final summary */
  .summary {
    display: none;
    background: var(--ink);
    color: var(--bg);
    border-radius: 4px;
    padding: 40px;
    text-align: center;
    margin-top: 48px;
    position: relative;
    overflow: hidden;
  }

  .summary.show { display: block; }

  .summary::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--gold), var(--accent), var(--gold));
  }

  .summary h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    margin-bottom: 8px;
    color: var(--bg);
  }

  .summary .subtitle {
    color: #c8b898;
    font-style: italic;
    margin-bottom: 36px;
    font-size: 0.9rem;
  }

  .summary-stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .stat-box {
    padding: 20px 28px;
    border: 1px solid rgba(200,185,150,0.25);
    border-radius: 4px;
    min-width: 120px;
  }

  .stat-box .big {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-box .label {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #c8b898;
  }

  .stat-box.total .big { color: #f0e8d0; }
  .stat-box.correct .big { color: #6edd99; }
  .stat-box.wrong .big { color: #ff8080; }

  .score-pct {
    font-size: 1.1rem;
    color: #c8b898;
    margin-bottom: 28px;
  }

  .score-pct span {
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
  }

  .btn-reset {
    background: var(--gold);
    color: var(--ink);
    border: none;
    padding: 12px 32px;
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }

  .btn-reset:hover {
    background: #e8a83a;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(200,146,42,0.3);
  }

  @media (max-width: 600px) {
    .header { flex-direction: column; gap: 16px; padding: 20px; }
    .scoreboard { justify-content: center; }
    .container { padding: 24px 16px 60px; }
    .question-header, .options { padding-left: 18px; padding-right: 18px; }
    .summary-stats { gap: 16px; }
    .stat-box .big { font-size: 2.2rem; }
  }
</style>
</head>

<script>

let answered = 0, correct = 0, wrong = 0;

function updateScoreboard() {
  document.getElementById('sc-total').textContent = answered;
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;
  const pct = Math.round(answered / QUIZ.length * 100);
  document.getElementById('progress').style.width = pct + '%';
  if (answered === QUIZ.length) showSummary();
}

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  answered = 0; correct = 0; wrong = 0;
  updateScoreboard();

  QUIZ.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + idx;

    const statusBar = document.createElement('div');
    statusBar.className = 'card-status';
    statusBar.id = 'status-' + idx;

    const header = document.createElement('div');
    header.className = 'question-header';
    header.innerHTML = `
      <span class="q-num">${idx + 1}.</span>
      <span class="q-text">${item.q}</span>
    `;

    const optionsDiv = document.createElement('div');
    optionsDiv.className = 'options';
    optionsDiv.id = 'opts-' + idx;

    ['A','B','C','D'].forEach(letter => {
      if (!item.opts[letter]) return;
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.dataset.letter = letter;
      btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${item.opts[letter]}</span>`;
      btn.addEventListener('click', () => handleAnswer(idx, letter, item.ans));
      optionsDiv.appendChild(btn);
    });

    const reveal = document.createElement('div');
    reveal.className = 'answer-reveal';
    reveal.id = 'reveal-' + idx;

    card.appendChild(statusBar);
    card.appendChild(header);
    card.appendChild(optionsDiv);
    card.appendChild(reveal);
    container.appendChild(card);
  });

  document.getElementById('summary').style.display = 'none';
  document.getElementById('summary').classList.remove('show');
}

function handleAnswer(idx, chosen, correct_ans) {
  const optsDiv = document.getElementById('opts-' + idx);
  const reveal = document.getElementById('reveal-' + idx);
  const statusBar = document.getElementById('status-' + idx);
  const btns = optsDiv.querySelectorAll('.option');
  
  // Disable all
  btns.forEach(btn => {
    btn.disabled = true;
    const letter = btn.dataset.letter;
    if (letter === correct_ans) {
      btn.classList.add('correct');
    } else if (letter === chosen && chosen !== correct_ans) {
      btn.classList.add('wrong');
    } else {
      btn.classList.add('dimmed');
    }
  });

  const isCorrect = chosen === correct_ans;
  
  // Status bar
  statusBar.classList.add(isCorrect ? 's-correct' : 's-wrong');

  // Reveal message
  reveal.classList.add('show');
  if (isCorrect) {
    reveal.classList.add('is-correct');
    reveal.innerHTML = `<span class="icon">✓</span><span class="reveal-text"><strong>Benar!</strong> Jawaban yang tepat adalah <strong>${correct_ans}. ${QUIZ[idx].opts[correct_ans]}</strong></span>`;
    correct++;
  } else {
    reveal.classList.add('is-wrong');
    reveal.innerHTML = `<span class="icon">✗</span><span class="reveal-text"><strong>Salah.</strong> Jawaban yang benar adalah <strong>${correct_ans}. ${QUIZ[idx].opts[correct_ans]}</strong></span>`;
    wrong++;
  }

  answered++;
  updateScoreboard();

  // Scroll to next unanswered
  setTimeout(() => {
    const nextIdx = idx + 1;
    if (nextIdx < QUIZ.length) {
      const nextCard = document.getElementById('card-' + nextIdx);
      if (nextCard) {
        const y = nextCard.getBoundingClientRect().top + window.scrollY - 120;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
    }
  }, 400);
}

function showSummary() {
  const summary = document.getElementById('summary');
  summary.classList.add('show');
  summary.style.display = 'block';
  document.getElementById('final-total').textContent = answered;
  document.getElementById('final-correct').textContent = correct;
  document.getElementById('final-wrong').textContent = wrong;
  const pct = Math.round(correct / QUIZ.length * 100);
  document.getElementById('final-pct').textContent = pct + '%';
  
  setTimeout(() => {
    summary.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 300);
}

// Build quiz on load
buildQuiz();
</script>

      </div>

        <div class="label">Benar</div>
      </div>

  </div>
</div>
