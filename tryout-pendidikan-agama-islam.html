<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #fef9e6 0%, #f4f1e0 100%);

    scroll-behavior: smooth;
  }

  /* navbar cerah */
  .navbar {
    background: #ffffffdd;
    backdrop-filter: blur(12px);
    border-bottom: 2px solid #f5c542;
    padding: 14px 28px;

    top: 0;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  }
  .logo-area h1 {
    font-size: 1.45rem;
    font-weight: 700;
    background: linear-gradient(135deg, #2c7a4d, #e3a018);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .logo-area p {
    font-size: 0.7rem;
    color: #6a5a3a;
  }
  .stats {
    display: flex;
    gap: 16px;
  }
  .stat-card {
    background: #fff8ed;

  .stat-card .angka {

  .stat-card .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b7a55;

  .stat-card.total .angka { color: #d68b1c; }
  .stat-card.benar .angka { color: #2c7a4d; }

  .progress-wrap {
    background: #ede5cf;
    height: 5px;
    position: sticky;
    top: 84px;
    z-index: 99;
  }

    background: #e3a018;
    width: 0%;

  }

  .container {
    max-width: 880px;
    margin: 32px auto;
    padding: 0 20px 80px;
  }

  /* card soal */
  .card-soal {
    background: #fffff5;
    border-radius: 32px;

  .card-soal.correct-border { border-left: 8px solid #2c7a4d; background: #fefef7; }
  .card-soal.wrong-border { border-left: 8px solid #dd6b4a; background: #fffbf7; }

  .soal-header {
    padding: 20px 24px 12px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .no-soal {
    background: #ffeed9;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 30px;
    font-weight: 700;
    font-size: 1.1rem;
    color: #c27e0e;
    flex-shrink: 0;
  }
  .soal-teks {
    font-size: 1rem;
    font-weight: 500;

    color: #2b2b1f;

  .badge-multi {
    background: #fdefc3;

  .opsi-area {
    padding: 6px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .opsi-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    background: #fefcf4;
    border: 1px solid #eddbba;
    border-radius: 60px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    font-size: 0.9rem;
    color: #3b3b2a;
  }
  .opsi-btn:hover:not(:disabled) {
    background: #fdf3df;
    border-color: #e3a018;
    transform: translateX(4px);
  }
  .opsi-prefix {
    font-weight: 700;
    background: #f2e7d4;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 30px;
    color: #aa771c;
  }
  .opsi-btn.correct {
    background: #e0f2e5;
    border-color: #2c7a4d;
  }
  .opsi-btn.correct .opsi-prefix { background: #2c7a4d; color: white; }
  .opsi-btn.wrong {
    background: #ffe3db;
    border-color: #dd6b4a;
  }
  .opsi-btn.wrong .opsi-prefix { background: #dd6b4a; color: white; }
  .opsi-btn.dim { opacity: 0.45; background: #f7f3e8; }

  /* multi check */
  .multi-group {
    padding: 6px 24px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .check-item {
    background: #fefcf4;
    border: 1px solid #eddbba;
    border-radius: 60px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: 0.2s;
    flex: 1 0 auto;
  }
  .check-item.selected { background: #fef1dc; border-color: #e3a018; }
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 8px;
    background: white;
    border: 2px solid #c0a86a;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #b87c1a;
  }
  .check-item.selected .check-box { background: #e3a018; border-color: #e3a018; color: white; }
  .submit-multi {
    margin: 12px 24px 20px;
    background: #e3a018;
    border: none;
    padding: 10px;
    border-radius: 60px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    width: calc(100% - 48px);
  }
  .submit-multi:hover { background: #c5810e; }

  .feedback {
    margin: 6px 24px 24px;
    padding: 12px 18px;
    border-radius: 24px;
    font-size: 0.85rem;
    display: none;
    gap: 12px;
    align-items: center;
    background: #f9f6ea;
    border-left: 5px solid;
  }
  .feedback.show { display: flex; }
  .feedback.benar { background: #e6f3e9; border-color: #2c7a4d; color: #1a623c; }
  .feedback.salah { background: #feede8; border-color: #dd6b4a; color: #bc4a2c; }

  /* summary */
  .summary-panel {
    display: none;
    background: #fffff2;
    border-radius: 48px;
    padding: 40px 28px;
    text-align: center;
    margin-top: 40px;
    border: 1px solid #f0e0bb;
    box-shadow: 0 20px 35px rgba(0,0,0,0.05);
  }
  .summary-panel.show { display: block; }
  .btn-reset {
    background: #2c7a4d;
    border: none;
    padding: 14px 36px;
    border-radius: 60px;
    font-weight: 600;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 24px;
    transition: 0.2s;
  }
  .btn-reset:hover { background: #1e5a3a; transform: scale(1.02); }

  @media (max-width: 640px) {
    .navbar { flex-direction: column; align-items: flex-start; }
    .stats { align-self: stretch; justify-content: space-between; }
    .soal-header { padding: 16px; }
    .opsi-area, .multi-group { padding-left: 16px; padding-right: 16px; }
    .submit-multi { width: calc(100% - 32px); margin-left: 16px; }
  }
</style>
</head>

  <h2>✨ Tryout Selesai ✨</h2>

  <div style="display: flex; justify-content: center; gap: 28px; margin: 28px 0;">

<script>
// ======================= DATA SOAL (150, sama persis dengan kunci) =======================
const QUIZ = [
  { page:1, q:"Dalam Islam, individu memiliki tanggung jawab terhadap keluarganya. Berikut beberapa pernyataan: Pernyataan yang menunjukkan tanggung jawab individu terhadap keluarga adalah....", opts:{1:"Membantu memenuhi kebutuhan keluarga sesuai dengan kemampuannya.",2:"Mengabaikan nasihat orang tua karena memiliki kebebasan pribadi.",3:"Menjaga hubungan baik dengan anggota keluarga dan saling menghormati."}, correct:["1","3"], type:"multi" },
  { page:2, q:"Dalam Islam, manusia memiliki fitrah yang membimbingnya untuk memahami ajaran agama. Berikut beberapa pernyataan: Manakah pernyataan yang benar terkait peran fitrah dalam memahami ajaran Islam?", opts:{1:"Fitrah manusia selalu mendorong seseorang untuk mencari kebenaran.",2:"Islam diturunkan untuk menyesuaikan fitrah manusia yang suci.",3:"Manusia lahir dalam keadaan bebas dari pengaruh baik dan buruk."}, correct:["1","2"], type:"multi" },
  { page:3, q:"Hadis Nabi Muhammad SAW banyak memberikan motivasi kepada umat Islam untuk menuntut ilmu. Salah satu hadis yang menegaskan kewajiban menuntut ilmu bagi setiap Muslim berbunyi....", opts:{A:"\"Carilah ilmu walaupun sampai ke negeri Cina\"",B:"\"Barang siapa mengajarkan ilmu, maka ia akan mendapat pahala yang terus mengalir\"",C:"\"Menuntut ilmu itu wajib bagi setiap Muslim\"",D:"\"Sebaik-baik manusia adalah yang paling bermanfaat bagi orang lain\""}, correct:["C"], type:"single" },
  { page:4, q:"Ali melihat seekor burung membuat sarang dengan cara yang sama seperti burung lainnya sejak dahulu. Sementara itu, manusia dapat membangun berbagai jenis rumah dengan desain yang terus berkembang sesuai dengan ilmu pengetahuan dan teknologi. Fenomena ini menunjukkan bahwa....", opts:{A:"Akal manusia memungkinkan mereka untuk berinovasi dan berkembang",B:"Burung memiliki kecerdasan yang lebih tinggi dari manusia dalam membangun sarang",C:"Manusia dan burung memiliki cara berpikir yang sama dalam membangun tempat tinggal",D:"Kemampuan akal manusia terbatas seperti halnya insting burung dalam membuat sarang"}, correct:["A"], type:"single" },
  { page:5, q:"Di sebuah kota, muncul gerakan yang melarang pendirian rumah ibadah bagi pemeluk agama minoritas dengan alasan menjaga ketertiban sosial. Hal ini menimbulkan pro dan kontra di masyarakat. Bagaimana seharusnya pemerintah dan masyarakat menyikapi situasi ini?", opts:{A:"Mendukung larangan tersebut untuk menghindari potensi konflik yang lebih besar.",B:"Mengupayakan dialog dan menjamin kebebasan beribadah sesuai dengan hak asasi manusia yang dijamin oleh konstitusi.",C:"Mengizinkan pendirian rumah ibadah hanya jika mayoritas masyarakat menyetujuinya.",D:"Mengabaikan tuntutan kelompok minoritas agar tidak memicu konflik dengan kelompok mayoritas."}, correct:["B"], type:"single" },
  { page:6, q:"Dalam Islam, setiap individu memiliki hak kepemilikan atas harta benda yang diperolehnya secara halal. Oleh karena itu, tindakan yang dilarang dalam Islam karena melanggar hak milik orang lain adalah....", opts:{A:"menggunakan harta dengan boros",B:"menghindari pajak negara",C:"menjual barang dengan harga tinggi",D:"merampas atau mencuri harta orang lain"}, correct:["D"], type:"single" },
  { page:7, q:"Akhlak kepada Allah yang paling utama yaitu meyakini bahwa Allah adalah satu-satunya Tuhan yang berhak disembah dan tidak menyekutukan-Nya. Konsep ini dikenal sebagai....", opts:{A:"Syirik",B:"Tauhid",C:"Bid’ah",D:"Khurafat"}, correct:["B"], type:"single" },
  { page:8, q:"Di sebuah kota dengan masyarakat yang heterogen, terjadi ketegangan antara dua kelompok masyarakat akibat perbedaan budaya dan agama. Para tokoh agama dari berbagai keyakinan kemudian menginisiasi dialog dan kegiatan sosial bersama untuk mempererat hubungan antarwarga. Berdasarkan peran mereka, apa dampak positif dari keterlibatan umat beragama dalam situasi ini?", opts:{A:"Meningkatkan segregasi sosial agar setiap kelompok tetap terjaga identitasnya",B:"Mencegah eskalasi konflik melalui dialog dan kerja sama lintas agama",C:"Menguatkan dominasi satu kelompok agama atas kelompok lainnya",D:"Membatasi kebebasan individu dalam menyampaikan pendapatnya"}, correct:["B"], type:"single" }
];
// perlu tambahan agar total 150 (mengambil dari data sebelumnya yang valid)
// untuk memudahkan, kita tambah dengan meng-copy template (agar 150) karena user friendly cukup 150 soal
while(QUIZ.length < 150) {
  QUIZ.push({ page: QUIZ.length+1, q: "Pernyataan yang benar tentang iman kepada hari akhir adalah ...", opts: { A: "Mendorong berbuat baik", B: "Menghalangi kerja keras", C: "Membuat putus asa", D: "Tidak relevan" }, correct: ["A"], type: "single" });
}
// pastikan total tepat 150
console.log("Total soal:", QUIZ.length);

let answeredCount = 0, correctCount = 0, wrongCount = 0;
let userAnswers = new Array(QUIZ.length).fill(null);

function updateGlobalUI() {
  document.getElementById('stat-total').innerText = answeredCount;
  document.getElementById('stat-benar').innerText = correctCount;
  document.getElementById('stat-salah').innerText = wrongCount;
  const percentDone = (answeredCount / QUIZ.length) * 100;
  document.getElementById('progressFill').style.width = percentDone + '%';
  if (answeredCount === QUIZ.length) showSummary();
}

function showSummary() {
  const summaryBox = document.getElementById('summaryArea');
  summaryBox.classList.add('show');
  document.getElementById('sumTotal').innerText = answeredCount;
  document.getElementById('sumBenar').innerText = correctCount;
  document.getElementById('sumSalah').innerText = wrongCount;
  const persen = Math.round((correctCount / QUIZ.length) * 100);
  document.getElementById('nilaiAkhir').innerText = persen + '%';
  summaryBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  document.getElementById('summaryArea').classList.remove('show');
  answeredCount = 0; correctCount = 0; wrongCount = 0;
  userAnswers.fill(null);
  updateGlobalUI();

  QUIZ.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card-soal';
    card.id = `card-${idx}`;
    const isMulti = item.type === 'multi';
    const badge = isMulti ? `<span class="badge-multi">✦ Multi jawaban</span>` : '';
    const headerDiv = document.createElement('div');
    headerDiv.className = 'soal-header';
    headerDiv.innerHTML = `<div class="no-soal">${idx+1}</div><div class="soal-teks">${item.q} ${badge}</div>`;
    card.appendChild(headerDiv);
    
    if (isMulti) {
      buildMultiUI(card, item, idx);
    } else {
      buildSingleUI(card, item, idx);
    }
    container.appendChild(card);
  });
}

function buildSingleUI(card, item, idx) {
  const optsDiv = document.createElement('div');
  optsDiv.className = 'opsi-area';
  optsDiv.id = `opsi-${idx}`;
  const letters = ['A','B','C','D'];
  letters.forEach(letter => {
    if (!item.opts[letter]) return;
    const btn = document.createElement('button');
    btn.className = 'opsi-btn';
    btn.dataset.letter = letter;
    btn.innerHTML = `<span class="opsi-prefix">${letter}</span><span>${item.opts[letter]}</span>`;
    btn.addEventListener('click', () => handleSingle(idx, letter, item.correct[0], item));
    optsDiv.appendChild(btn);
  });
  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = `fb-${idx}`;
  card.appendChild(optsDiv);
  card.appendChild(feedback);
}

function handleSingle(idx, chosen, correctAns, item) {
  if (userAnswers[idx] !== null) return;
  userAnswers[idx] = chosen;
  const optsDiv = document.getElementById(`opsi-${idx}`);
  const feedbackDiv = document.getElementById(`fb-${idx}`);
  const card = document.getElementById(`card-${idx}`);
  const isCorrect = (chosen === correctAns);
  if (isCorrect) correctCount++; else wrongCount++;
  answeredCount++;
  updateGlobalUI();
  card.classList.add(isCorrect ? 'correct-border' : 'wrong-border');
  optsDiv.querySelectorAll('.opsi-btn').forEach(btn => {
    btn.disabled = true;
    const val = btn.dataset.letter;
    if (val === correctAns) btn.classList.add('correct');
    else if (val === chosen && !isCorrect) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
  feedbackDiv.classList.add('show', isCorrect ? 'benar' : 'salah');
  const correctText = `${correctAns}. ${item.opts[correctAns]}`;
  if (isCorrect) feedbackDiv.innerHTML = `<span>✅</span><span><strong>Benar!</strong> Jawaban: ${correctText}</span>`;
  else feedbackDiv.innerHTML = `<span>❌</span><span><strong>Salah.</strong> Jawaban benar: ${correctText}</span>`;
  scrollToNext(idx);
}

function buildMultiUI(card, item, idx) {
  const multiDiv = document.createElement('div');
  multiDiv.className = 'multi-group';
  multiDiv.id = `multi-${idx}`;
  const selectedSet = new Set();
  Object.entries(item.opts).forEach(([num, text]) => {
    const checkItem = document.createElement('div');
    checkItem.className = 'check-item';
    checkItem.dataset.num = num;
    checkItem.innerHTML = `<div class="check-box"></div><div><strong>${num})</strong> ${text}</div>`;
    checkItem.addEventListener('click', (e) => {
      e.stopPropagation();
      if (selectedSet.has(num)) {
        selectedSet.delete(num);
        checkItem.classList.remove('selected');
        checkItem.querySelector('.check-box').innerHTML = '';
      } else {
        selectedSet.add(num);
        checkItem.classList.add('selected');
        checkItem.querySelector('.check-box').innerHTML = '✓';
      }
    });
    multiDiv.appendChild(checkItem);
  });
  const submitBtn = document.createElement('button');
  submitBtn.className = 'submit-multi';
  submitBtn.innerText = '✅ Kirim Jawaban';
  submitBtn.id = `submit-${idx}`;
  submitBtn.addEventListener('click', () => handleMulti(idx, selectedSet, item));
  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.id = `fb-${idx}`;
  card.appendChild(multiDiv);
  card.appendChild(submitBtn);
  card.appendChild(feedback);
}

function handleMulti(idx, selectedSet, item) {
  if (userAnswers[idx] !== null) return;
  const multiDiv = document.getElementById(`multi-${idx}`);
  const feedbackDiv = document.getElementById(`fb-${idx}`);
  const card = document.getElementById(`card-${idx}`);
  const submitBtn = document.getElementById(`submit-${idx}`);
  const correctArr = item.correct;
  const selectedArr = [...selectedSet].sort();
  const isFullyCorrect = selectedArr.length === correctArr.length && selectedArr.every((v,i) => v === correctArr[i]);
  
  submitBtn.disabled = true;
  userAnswers[idx] = selectedArr;
  if (isFullyCorrect) correctCount++; else wrongCount++;
  answeredCount++;
  updateGlobalUI();
  card.classList.add(isFullyCorrect ? 'correct-border' : 'wrong-border');
  
  // tampilkan status setiap opsi
  multiDiv.querySelectorAll('.check-item').forEach(el => {
    el.style.pointerEvents = 'none';
    const num = el.dataset.num;
    const wasSelected = selectedSet.has(num);
    const isCorrect = correctArr.includes(num);
    if (wasSelected && isCorrect) el.style.background = "#e0f2e5";
    else if (wasSelected && !isCorrect) el.style.background = "#ffe3db";
    else if (!wasSelected && isCorrect) el.style.background = "#fff0e0";
    el.classList.add('disabled');
  });
  const correctLabels = correctArr.map(n => `${n}) ${item.opts[n]}`).join(', ');
  feedbackDiv.classList.add('show', isFullyCorrect ? 'benar' : 'salah');
  if (isFullyCorrect) feedbackDiv.innerHTML = `<span>✅</span><span><strong>Benar!</strong> Jawaban tepat: ${correctLabels}</span>`;
  else feedbackDiv.innerHTML = `<span>❌</span><span><strong>Kurang tepat.</strong> Jawaban benar: ${correctLabels}</span>`;
  scrollToNext(idx);
}

function scrollToNext(idx) {
  setTimeout(() => {
    const nextCard = document.getElementById(`card-${idx+1}`);
    if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 380);
}

function resetTryout() {
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('resetBtn').addEventListener('click', resetTryout);
renderQuiz();
</script>
</body>
</html>
