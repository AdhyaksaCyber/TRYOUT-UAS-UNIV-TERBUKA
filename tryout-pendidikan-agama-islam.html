<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tryout Pendidikan Agama Islam (Kunci Terkoreksi)</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Serif:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1a0f;
    --surface: #152015;
    --card: #1a2a1a;
    --border: #2d4a2d;
    --ink: #e8f0e8;
    --ink-muted: #8aaa8a;
    --gold: #c8a84b;
    --gold-light: #e8c86a;
    --green: #4caf80;
    --green-dark: #2d7a50;
    --red: #e05050;
    --red-dark: #a02828;
    --correct-bg: #0d2a1a;
    --wrong-bg: #2a0d0d;
    --hover: #202f20;
    --shadow: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif', Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      repeating-linear-gradient(60deg, transparent, transparent 30px, rgba(200,168,75,0.025) 31px),
      repeating-linear-gradient(-60deg, transparent, transparent 30px, rgba(200,168,75,0.025) 31px);
    pointer-events: none;
    z-index: 0;
  }

  .header {
    background: linear-gradient(135deg, #0a1a0a 0%, #152515 50%, #0a1a0a 100%);
    border-bottom: 2px solid var(--gold);
    padding: 20px 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.4;
  }

  .title-block h1 {
    font-family: 'Amiri', serif;
    font-size: 1.4rem;
    color: var(--gold-light);
    letter-spacing: 0.03em;
  }

  .title-block p {
    font-size: 0.75rem;
    color: var(--ink-muted);
    margin-top: 2px;
    font-style: italic;
  }

  .scoreboard {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }

  .pill {
    background: rgba(200,168,75,0.08);
    border: 1px solid rgba(200,168,75,0.2);
    border-radius: 4px;
    padding: 6px 12px;
    text-align: center;
    min-width: 64px;
  }

  .pill .num {
    font-family: 'Amiri', serif;
    font-size: 1.4rem;
    line-height: 1;
    font-weight: 700;
  }

  .pill .lbl {
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  .pill.total .num { color: #e8e0c8; }
  .pill.correct .num { color: var(--green); }
  .pill.wrong .num { color: var(--red); }

  .progress-bar {
    height: 2px;
    background: rgba(200,168,75,0.1);
    position: sticky;
    top: 82px;
    z-index: 99;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green-dark), var(--gold));
    transition: width 0.5s ease;
    width: 0%;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative;
    z-index: 1;
  }

  .multi-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(200,168,75,0.1);
    border: 1px solid rgba(200,168,75,0.25);
    border-radius: 3px;
    padding: 2px 8px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 28px;
    overflow: hidden;
    box-shadow: 0 4px 20px var(--shadow);
    transition: border-color 0.3s;
  }

  .card.s-correct { border-color: var(--green-dark); }
  .card.s-wrong { border-color: var(--red-dark); }

  .card-top {
    height: 3px;
    background: transparent;
    transition: background 0.3s;
  }
  .card.s-correct .card-top { background: var(--green); }
  .card.s-wrong .card-top { background: var(--red); }

  .q-header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .q-num {
    font-family: 'Amiri', serif;
    font-size: 1.05rem;
    color: var(--gold);
    font-weight: 700;
    min-width: 30px;
    flex-shrink: 0;
  }

  .q-body {
    flex: 1;
  }

  .q-text {
    font-size: 0.92rem;
    line-height: 1.75;
    color: var(--ink);
  }

  .options {
    padding: 14px 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s ease;
    background: transparent;
    text-align: left;
    width: 100%;
    font-family: 'Noto Serif', serif;
    font-size: 0.88rem;
    color: var(--ink);
    line-height: 1.55;
  }

  .option:hover:not(:disabled) {
    background: var(--hover);
    border-color: var(--gold);
    transform: translateX(3px);
  }

  .opt-key {
    font-family: 'Amiri', serif;
    font-weight: 700;
    color: var(--gold);
    min-width: 20px;
    flex-shrink: 0;
    font-size: 0.95rem;
  }

  .option:disabled { cursor: default; transform: none !important; }

  .option.correct {
    background: var(--correct-bg) !important;
    border-color: var(--green) !important;
    color: var(--green);
  }
  .option.correct .opt-key { color: var(--green); }

  .option.wrong {
    background: var(--wrong-bg) !important;
    border-color: var(--red) !important;
    color: var(--red);
  }
  .option.wrong .opt-key { color: var(--red); }

  .option.dimmed { opacity: 0.3; }

  .multi-section {
    padding: 14px 24px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .check-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    background: transparent;
    font-family: 'Noto Serif', serif;
    font-size: 0.88rem;
    color: var(--ink);
    transition: all 0.15s;
    flex: 1;
    min-width: 0;
    text-align: left;
  }

  .check-opt:hover:not(:disabled) {
    background: var(--hover);
    border-color: var(--gold);
  }

  .check-opt.selected {
    background: rgba(200,168,75,0.12);
    border-color: var(--gold);
    color: var(--gold-light);
  }

  .check-opt.correct {
    background: var(--correct-bg) !important;
    border-color: var(--green) !important;
    color: var(--green) !important;
  }

  .check-opt.wrong {
    background: var(--wrong-bg) !important;
    border-color: var(--red) !important;
    color: var(--red) !important;
  }

  .check-opt.missed {
    background: rgba(76,175,128,0.08) !important;
    border-color: var(--green-dark) !important;
    color: var(--green) !important;
    opacity: 0.7;
  }

  .check-opt:disabled { cursor: default; }

  .check-box {
    width: 16px; height: 16px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: all 0.15s;
  }

  .check-opt.selected .check-box { background: var(--gold); border-color: var(--gold); color: #0a1a0a; }
  .check-opt.correct .check-box { background: var(--green); border-color: var(--green); color: #fff; }
  .check-opt.wrong .check-box { background: var(--red); border-color: var(--red); color: #fff; }
  .check-opt.missed .check-box { background: transparent; border-color: var(--green); color: var(--green); }

  .opt-num {
    font-family: 'Amiri', serif;
    font-weight: 700;
    color: var(--gold);
    flex-shrink: 0;
  }

  .submit-multi {
    margin: 10px 24px 18px;
    padding: 9px 20px;
    background: rgba(200,168,75,0.15);
    border: 1px solid var(--gold);
    border-radius: 3px;
    color: var(--gold-light);
    font-family: 'Amiri', serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    width: calc(100% - 48px);
  }

  .submit-multi:hover { background: rgba(200,168,75,0.25); }
  .submit-multi:disabled { opacity: 0.4; cursor: default; }

  .reveal {
    margin: 0 24px 18px;
    padding: 11px 14px;
    border-radius: 3px;
    font-size: 0.85rem;
    display: none;
    align-items: flex-start;
    gap: 10px;
    border-left: 3px solid;
    line-height: 1.6;
  }

  .reveal.show { display: flex; }
  .reveal.is-correct { background: var(--correct-bg); border-color: var(--green); color: #7ad9a8; }
  .reveal.is-wrong { background: var(--wrong-bg); border-color: var(--red); color: #e08080; }
  .reveal .icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
  .reveal strong { color: inherit; font-weight: 600; }

  .summary {
    display: none;
    background: var(--card);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 44px 32px;
    text-align: center;
    margin-top: 48px;
    position: relative;
  }

  .summary::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .summary.show { display: block; }

  .summary h2 {
    font-family: 'Amiri', serif;
    font-size: 2.2rem;
    color: var(--gold-light);
    margin-bottom: 6px;
  }

  .summary .sub {
    color: var(--ink-muted);
    font-style: italic;
    font-size: 0.85rem;
    margin-bottom: 36px;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .stat {
    padding: 18px 24px;
    border: 1px solid rgba(200,168,75,0.2);
    border-radius: 4px;
    min-width: 110px;
  }

  .stat .big {
    font-family: 'Amiri', serif;
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat .slabel {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .stat.total .big { color: #e8e0c8; }
  .stat.correct .big { color: var(--green); }
  .stat.wrong .big { color: var(--red); }

  .score-line {
    font-size: 1rem;
    color: var(--ink-muted);
    margin-bottom: 28px;
  }

  .score-line span {
    font-family: 'Amiri', serif;
    font-size: 1.6rem;
    color: var(--gold-light);
  }

  .btn-reset {
    background: linear-gradient(135deg, var(--green-dark), var(--gold));
    color: var(--bg);
    border: none;
    padding: 12px 36px;
    font-family: 'Amiri', serif;
    font-size: 1.05rem;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }

  .btn-reset:hover {
    opacity: 0.9;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(200,168,75,0.25);
  }

  @media (max-width: 600px) {
    .header { flex-direction: column; align-items: flex-start; padding: 16px; }
    .scoreboard { align-self: stretch; justify-content: space-between; }
    .container { padding: 24px 12px 60px; }
    .q-header, .options, .multi-section { padding-left: 14px; padding-right: 14px; }
    .submit-multi { margin-left: 14px; margin-right: 14px; width: calc(100% - 28px); }
    .reveal { margin-left: 14px; margin-right: 14px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="title-block">
    <h1>Tryout Pendidikan Agama Islam</h1>
    <p>MKWN4101 &mdash; 150 Soal &mdash; Pilihan Ganda & Multi Jawaban</p>
  </div>
  <div class="scoreboard">
    <div class="pill total"><div class="num" id="sc-total">0</div><div class="lbl">Dijawab</div></div>
    <div class="pill correct"><div class="num" id="sc-correct">0</div><div class="lbl">Benar</div></div>
    <div class="pill wrong"><div class="num" id="sc-wrong">0</div><div class="lbl">Salah</div></div>
  </div>
</header>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

<div class="container" id="quiz"></div>

<script>
// Data soal yang telah dikoreksi berdasarkan PDF jawaban (150 soal)
const QUIZ = [
{"page":1,"q":"Dalam Islam, individu memiliki tanggung jawab terhadap keluarganya. Berikut beberapa pernyataan: Pernyataan yang menunjukkan tanggung jawab individu terhadap keluarga adalah....","opts":{"1":"Membantu memenuhi kebutuhan keluarga sesuai dengan kemampuannya.","2":"Mengabaikan nasihat orang tua karena memiliki kebebasan pribadi.","3":"Menjaga hubungan baik dengan anggota keluarga dan saling menghormati."},"correct":["1","3"],"type":"multi"},
{"page":2,"q":"Dalam Islam, manusia memiliki fitrah yang membimbingnya untuk memahami ajaran agama. Berikut beberapa pernyataan: Manakah pernyataan yang benar terkait peran fitrah dalam memahami ajaran Islam?","opts":{"1":"Fitrah manusia selalu mendorong seseorang untuk mencari kebenaran.","2":"Islam diturunkan untuk menyesuaikan fitrah manusia yang suci.","3":"Manusia lahir dalam keadaan bebas dari pengaruh baik dan buruk."},"correct":["1","2"],"type":"multi"},
{"page":3,"q":"Hadis Nabi Muhammad SAW banyak memberikan motivasi kepada umat Islam untuk menuntut ilmu. Salah satu hadis yang menegaskan kewajiban menuntut ilmu bagi setiap Muslim berbunyi....","opts":{"A":"\"Carilah ilmu walaupun sampai ke negeri Cina\"","B":"\"Barang siapa mengajarkan ilmu, maka ia akan mendapat pahala yang terus mengalir\"","C":"\"Menuntut ilmu itu wajib bagi setiap Muslim\"","D":"\"Sebaik-baik manusia adalah yang paling bermanfaat bagi orang lain\""},"correct":["C"],"type":"single"},
{"page":4,"q":"Ali melihat seekor burung membuat sarang dengan cara yang sama seperti burung lainnya sejak dahulu. Sementara itu, manusia dapat membangun berbagai jenis rumah dengan desain yang terus berkembang sesuai dengan ilmu pengetahuan dan teknologi. Fenomena ini menunjukkan bahwa....","opts":{"A":"Akal manusia memungkinkan mereka untuk berinovasi dan berkembang","B":"Burung memiliki kecerdasan yang lebih tinggi dari manusia dalam membangun sarang","C":"Manusia dan burung memiliki cara berpikir yang sama dalam membangun tempat tinggal","D":"Kemampuan akal manusia terbatas seperti halnya insting burung dalam membuat sarang"},"correct":["A"],"type":"single"},
{"page":5,"q":"Di sebuah kota, muncul gerakan yang melarang pendirian rumah ibadah bagi pemeluk agama minoritas dengan alasan menjaga ketertiban sosial. Hal ini menimbulkan pro dan kontra di masyarakat. Bagaimana seharusnya pemerintah dan masyarakat menyikapi situasi ini?","opts":{"A":"Mendukung larangan tersebut untuk menghindari potensi konflik yang lebih besar.","B":"Mengupayakan dialog dan menjamin kebebasan beribadah sesuai dengan hak asasi manusia yang dijamin oleh konstitusi.","C":"Mengizinkan pendirian rumah ibadah hanya jika mayoritas masyarakat menyetujuinya.","D":"Mengabaikan tuntutan kelompok minoritas agar tidak memicu konflik dengan kelompok mayoritas."},"correct":["B"],"type":"single"},
{"page":6,"q":"Dalam Islam, setiap individu memiliki hak kepemilikan atas harta benda yang diperolehnya secara halal. Oleh karena itu, tindakan yang dilarang dalam Islam karena melanggar hak milik orang lain adalah....","opts":{"A":"menggunakan harta dengan boros","B":"menghindari pajak negara","C":"menjual barang dengan harga tinggi","D":"merampas atau mencuri harta orang lain"},"correct":["D"],"type":"single"},
{"page":7,"q":"Akhlak kepada Allah yang paling utama yaitu meyakini bahwa Allah adalah satu-satunya Tuhan yang berhak disembah dan tidak menyekutukan-Nya. Konsep ini dikenal sebagai....","opts":{"A":"Syirik","B":"Tauhid","C":"Bid’ah","D":"Khurafat"},"correct":["B"],"type":"single"},
{"page":8,"q":"Di sebuah kota dengan masyarakat yang heterogen, terjadi ketegangan antara dua kelompok masyarakat akibat perbedaan budaya dan agama. Para tokoh agama dari berbagai keyakinan kemudian menginisiasi dialog dan kegiatan sosial bersama untuk mempererat hubungan antarwarga. Berdasarkan peran mereka, apa dampak positif dari keterlibatan umat beragama dalam situasi ini?","opts":{"A":"Meningkatkan segregasi sosial agar setiap kelompok tetap terjaga identitasnya","B":"Mencegah eskalasi konflik melalui dialog dan kerja sama lintas agama","C":"Menguatkan dominasi satu kelompok agama atas kelompok lainnya","D":"Membatasi kebebasan individu dalam menyampaikan pendapatnya"},"correct":["B"],"type":"single"},
{"page":9,"q":"Dalam suatu negara, semua warga negara mendapatkan hak yang sama di depan hukum, tanpa memandang status sosial, ekonomi, atau latar belakang mereka. Hal ini mencerminkan prinsip....","opts":{"A":"Supremasi hukum","B":"Keadilan","C":"Egalitarianisme","D":"Pluralisme"},"correct":["C"],"type":"single"},
{"page":10,"q":"Seorang pemimpin di suatu organisasi selalu menganggap dirinya paling benar dan meremehkan pendapat bawahannya. Akibatnya, para anggota merasa tidak dihargai dan enggan berpartisipasi dalam diskusi. Dampak negatif dari sikap takabbur ini adalah....","opts":{"A":"Meningkatkan solidaritas antaranggota organisasi","B":"Menumbuhkan rasa hormat dari bawahan kepada pemimpin","C":"Menurunkan semangat kerja dan menghambat kerja sama dalam organisasi","D":"Meningkatkan kepercayaan diri anggota dalam menyampaikan pendapat"},"correct":["C"],"type":"single"},
{"page":11,"q":"Dalam Islam, berbuat baik kepada sesama merupakan kewajiban yang dianjurkan oleh Allah SWT. Salah satu bentuk berbuat baik kepada orang lain adalah....","opts":{"A":"Memperlakukan orang lain dengan sopan dan menghormati mereka","B":"Membantu orang lain hanya ketika kita memiliki kelebihan harta","C":"Menghindari interaksi dengan orang lain agar tidak menimbulkan konflik","D":"Memberikan bantuan hanya kepada orang yang seagama"},"correct":["A"],"type":"single"},
{"page":12,"q":"Rizal sering mendiskusikan berbagai teori ilmiah di kampusnya. Namun, ia selalu memeriksa kebenaran informasi yang diterima dengan merujuk pada Al-Qur’an dan hadis sebelum mempercayainya. Bagaimana iman dan ilmu berkontribusi terhadap budaya akademik dalam kasus Rizal?","opts":{"A":"Iman membimbing seseorang untuk selalu mencari kebenaran dan tidak mudah menerima informasi tanpa analisis.","B":"Iman menghambat kebebasan berpikir dalam dunia akademik.","C":"Ilmu lebih penting dari iman dalam menganalisis suatu informasi.","D":"Dalam akademik, semua informasi harus diterima tanpa mempertimbangkan aspek keimanan."},"correct":["A"],"type":"single"},
{"page":13,"q":"Fatimah adalah seorang mahasiswa yang gigih dalam belajar. Ia selalu mengatur waktunya dengan baik, mengerjakan tugas tepat waktu, dan tidak mudah menyerah dalam menghadapi tantangan akademik. Apa prinsip etos kerja yang diterapkan Fatimah dalam mencapai kesuksesan?","opts":{"A":"Kerja keras dan disiplin akan membawa kesuksesan dan keberkahan.","B":"Kesuksesan hanya bisa diraih dengan bakat alami, bukan kerja keras.","C":"Berusaha tidak penting karena rezeki sudah ditentukan tanpa perlu usaha.","D":"Menjadi sukses hanya ditentukan oleh keberuntungan."},"correct":["A"],"type":"single"},
{"page":14,"q":"Dalam Al-Qur’an, salah satu istilah yang digunakan untuk menyebut manusia adalah basyar. Istilah ini menunjukkan bahwa manusia memiliki....","opts":{"A":"Kedudukan sebagai hamba Allah yang harus beribadah","B":"Kelebihan berupa akal untuk berpikir dan memahami","C":"Sifat biologis dan jasmani yang sama dengan makhluk lainnya","D":"Tanggung jawab sebagai pemimpin di muka bumi"},"correct":["C"],"type":"single"},

  if (answered === QUIZ.length) showSummary();
}

function buildQuiz() {
  answered = 0; correct = 0; wrong = 0;
  updateScore();
  const container = document.getElementById('quiz');
  container.innerHTML = '';
  const summaryDiv = document.getElementById('summary');
  if(summaryDiv) summaryDiv.style.display = 'none';

  QUIZ.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + idx;

    const topBar = document.createElement('div');
    topBar.className = 'card-top';

    const qHeader = document.createElement('div');
    qHeader.className = 'q-header';

    const isMulti = item.type === 'multi';
    const badge = isMulti ? '<span class="multi-badge">✦ Multi Jawaban</span>' : '';
    qHeader.innerHTML = `
      <span class="q-num">${idx+1}.</span>
      <div class="q-body"><span class="q-text">${item.q}</span>${badge}</div>
    `;

    card.appendChild(topBar);
    card.appendChild(qHeader);

    if (isMulti) {
      buildMulti(card, item, idx);
    } else {
      buildSingle(card, item, idx);
    }

    container.appendChild(card);
  });
}

function buildSingle(card, item, idx) {
  const optsDiv = document.createElement('div');
  optsDiv.className = 'options';
  optsDiv.id = 'opts-' + idx;

  ['A','B','C','D'].forEach(letter => {
    if (!item.opts[letter]) return;
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.dataset.letter = letter;
    btn.innerHTML = `<span class="opt-key">${letter}.</span><span>${item.opts[letter]}</span>`;
    btn.addEventListener('click', () => handleSingle(idx, letter, item.correct[0], item));
    optsDiv.appendChild(btn);
  });

  const reveal = document.createElement('div');
  reveal.className = 'reveal';
  reveal.id = 'reveal-' + idx;

  card.appendChild(optsDiv);
  card.appendChild(reveal);
}

function handleSingle(idx, chosen, correctAns, item) {
  const optsDiv = document.getElementById('opts-' + idx);
  const reveal = document.getElementById('reveal-' + idx);
  const card = document.getElementById('card-' + idx);

  optsDiv.querySelectorAll('.option').forEach(btn => {
    btn.disabled = true;
    const l = btn.dataset.letter;
    if (l === correctAns) btn.classList.add('correct');
    else if (l === chosen) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });

  const isCorrect = chosen === correctAns;
  card.classList.add(isCorrect ? 's-correct' : 's-wrong');
  reveal.classList.add('show', isCorrect ? 'is-correct' : 'is-wrong');

  if (isCorrect) {
    reveal.innerHTML = `<span class="icon">✓</span><span><strong>Benar!</strong> Jawaban: <strong>${correctAns}. ${item.opts[correctAns]}</strong></span>`;
    correct++;
  } else {
    reveal.innerHTML = `<span class="icon">✗</span><span><strong>Salah.</strong> Jawaban benar: <strong>${correctAns}. ${item.opts[correctAns]}</strong></span>`;
    wrong++;
  }

  answered++;
  updateScore();
  scrollToNext(idx);
}

function buildMulti(card, item, idx) {
  const section = document.createElement('div');
  section.className = 'multi-section';
  section.id = 'multi-' + idx;

  const selected = new Set();

  Object.entries(item.opts).forEach(([num, text]) => {
    const btn = document.createElement('button');
    btn.className = 'check-opt';
    btn.dataset.num = num;
    btn.innerHTML = `<span class="check-box"></span><span class="opt-num">${num})</span><span>${text}</span>`;
    btn.addEventListener('click', () => {
      if (selected.has(num)) {
        selected.delete(num);
        btn.classList.remove('selected');
        btn.querySelector('.check-box').textContent = '';
      } else {
        selected.add(num);
        btn.classList.add('selected');
        btn.querySelector('.check-box').textContent = '✓';
      }
    });
    section.appendChild(btn);
  });

  const submitBtn = document.createElement('button');
  submitBtn.className = 'submit-multi';
  submitBtn.id = 'submit-' + idx;
  submitBtn.textContent = 'Kirim Jawaban';
  submitBtn.addEventListener('click', () => handleMulti(idx, selected, item));

  const reveal = document.createElement('div');
  reveal.className = 'reveal';
  reveal.id = 'reveal-' + idx;

  card.appendChild(section);
  card.appendChild(submitBtn);
  card.appendChild(reveal);
}

function handleMulti(idx, selected, item) {
  const section = document.getElementById('multi-' + idx);
  const reveal = document.getElementById('reveal-' + idx);
  const card = document.getElementById('card-' + idx);
  const submitBtn = document.getElementById('submit-' + idx);
  const correctSet = new Set(item.correct);

  submitBtn.disabled = true;

  section.querySelectorAll('.check-opt').forEach(btn => {
    btn.disabled = true;
    const num = btn.dataset.num;
    const wasSelected = selected.has(num);
    const isCorrect = correctSet.has(num);
    btn.classList.remove('selected');
    btn.querySelector('.check-box').textContent = '';

    if (wasSelected && isCorrect) {
      btn.classList.add('correct');
      btn.querySelector('.check-box').textContent = '✓';
    } else if (wasSelected && !isCorrect) {
      btn.classList.add('wrong');
      btn.querySelector('.check-box').textContent = '✗';
    } else if (!wasSelected && isCorrect) {
      btn.classList.add('missed');
      btn.querySelector('.check-box').textContent = '✓';
    }
  });

  const selectedArr = [...selected].sort();
  const correctArr = [...correctSet].sort();
  const isFullyCorrect = selectedArr.length === correctArr.length &&
    selectedArr.every((v, i) => v === correctArr[i]);

  card.classList.add(isFullyCorrect ? 's-correct' : 's-wrong');
  reveal.classList.add('show', isFullyCorrect ? 'is-correct' : 'is-wrong');

  const correctLabels = correctArr.map(n => n + ') ' + item.opts[n]).join(', ');

  if (isFullyCorrect) {
    reveal.innerHTML = `<span class="icon">✓</span><span><strong>Benar!</strong> Semua jawaban tepat: <strong>${correctLabels}</strong></span>`;
    correct++;
  } else {
    reveal.innerHTML = `<span class="icon">✗</span><span><strong>Salah.</strong> Jawaban benar: <strong>${correctLabels}</strong></span>`;
    wrong++;
  }

  answered++;
  updateScore();
  scrollToNext(idx);
}

function scrollToNext(idx) {
  setTimeout(() => {
    const next = document.getElementById('card-' + (idx+1));
    if (next) window.scrollTo({ top: next.getBoundingClientRect().top + scrollY - 110, behavior: 'smooth' });
  }, 400);
}

function showSummary() {
  const s = document.getElementById('summary');
  s.style.display = 'block';
  s.classList.add('show');
  document.getElementById('f-total').textContent = answered;
  document.getElementById('f-correct').textContent = correct;
  document.getElementById('f-wrong').textContent = wrong;
  document.getElementById('f-pct').textContent = Math.round(correct/QUIZ.length*100) + '%';
  setTimeout(() => s.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
}

buildQuiz();
</script>

<div id="summary" class="summary" style="display:none">
  <div style="max-width:600px;margin:0 auto;">
    <h2>Hasil Tryout</h2>
    <p class="sub">Pendidikan Agama Islam &mdash; MKWN4101</p>
    <div class="stats">
      <div class="stat total"><div class="big" id="f-total">0</div><div class="slabel">Total Soal</div></div>
      <div class="stat correct"><div class="big" id="f-correct">0</div><div class="slabel">Benar</div></div>
      <div class="stat wrong"><div class="big" id="f-wrong">0</div><div class="slabel">Salah</div></div>
    </div>
    <p class="score-line">Nilai Akhir: <span id="f-pct">0%</span></p>
    <button class="btn-reset" onclick="buildQuiz(); window.scrollTo({top:0,behavior:'smooth'})">Ulangi Tryout</button>
  </div>
</div>

</body>
</html>
